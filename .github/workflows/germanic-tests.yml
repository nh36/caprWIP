name: Germanic tests

on:
  push:
    branches: [update]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  portable:
    name: Portable validation (not full local science validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install pytest -r Germanic/tests/requirements-test.txt
      - name: Install pinned Pandoc with built-in Lua
        env:
          PANDOC_VERSION: "3.9.0.2"
          PANDOC_SHA256: a69abfababda8a56969a254b09f9553a7be89ddec00d4e0fe9fd585d71a67508
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/pandoc.tar.gz"
          printf '%s  %s\n' "$PANDOC_SHA256" "$RUNNER_TEMP/pandoc.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/pandoc.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pandoc-${PANDOC_VERSION}/bin/pandoc" --version
      - name: Validate tracked science and portable projections
        run: |
          cores=$(nproc)
          echo "Available logical CPUs: $cores"
          grep '^MemTotal:' /proc/meminfo
          workers=1
          if [ "$cores" -ge 4 ]; then
            workers=4
          elif [ "$cores" -ge 2 ]; then
            workers=2
          fi
          python Germanic/tools/run_portable_checks.py --workers "$workers"
      - name: Upload complete validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-validation-logs
          path: |
            .ci-results/*.log
            .ci-results/*.xml
            .ci-results/*.md
            .ci-results/*.json
          if-no-files-found: error
          include-hidden-files: true
